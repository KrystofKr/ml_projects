[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-ml-portfolio"
version = "0.1.0"
description = "Leakage-safe, reproducible Titanic classification portfolio project"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.7",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "ipython>=9.0",
    "jupyter>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"